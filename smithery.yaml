# Smithery MCP Server Manifest
# https://smithery.ai/docs/config

name: financesec-mcp
title: Calera FINSEC — Certified SEC Memory
description: Certified SEC EDGAR fact memory for AI agents. Returns verified values with filing provenance or SAFE_REFUSAL. Zero hallucination guarantee — no language model in the fact path.
homepage: https://finsec.caleralabs.com/mcp
icon: https://finsec.caleralabs.com/assets/financial-sec-logo.svg
license: Apache-2.0
publisher: Calera Labs
tags:
  - sec
  - edgar
  - finance
  - certified-facts
  - provenance
  - financial-facts

# Transport configuration (Streamable Remote HTTP)
transport:
  type: http
  url: https://finsec.caleralabs.com/mcp

# Authentication & Configuration Requirements (Required + Optional for 100% Config UX)
config:
  properties:
    X-License-Key:
      type: string
      description: Calera Labs FinanceSec API License Key (manage free at https://dashboard.caleralabs.com)
      required: true
      isSecret: true
    low_tokens:
      type: boolean
      description: Optional. Enable compact 38-token schema for high-QPS agent swarms.
      required: false
      default: false
    target_currency:
      type: string
      description: Optional default ISO 4217 target currency (e.g. USD, EUR).
      required: false

# Certified 7-Tool Surface Area with Input & Output Schemas
tools:
  - name: query_financial_sec
    version: 1.2.1
    description: >-
      Certified SEC fact query. Returns verified values with provenance or SAFE_REFUSAL.
      Does not invent numbers. Treat SAFE_REFUSAL as success-of-honesty, not a tool failure.
      Monetary answers default to the filer's reporting currency; request FX conversion via
      target_currency / usd_only or natural-language 'in USD'.
    annotations:
      title: Query Certified SEC Facts
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Natural language financial question. Append 'in USD' to convert reporting currency.
        target_currency:
          type: string
          description: Optional ISO 4217 code (e.g. USD, EUR) for post-recall FX conversion.
        usd_only:
          type: boolean
          description: When true, forces monetary answers into USD.
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
      required:
        - query
    outputSchema:
      type: object
      properties:
        content:
          type: array
          description: List of MCP output content blocks containing verified SEC fact payload or SAFE_REFUSAL.
          items:
            type: object
            properties:
              type:
                type: string
                description: Content MIME type (text)
              text:
                type: string
                description: Serialized verified SEC fact response with cryptographic filing provenance
      required:
        - content

  - name: valuation_inputs
    version: 1.2.1
    description: >-
      Certified SEC/EDGAR valuation inputs pack (12 packs including dcf_valuation_inputs historical FCF).
      Not market EV, P/E, or trading DCF.
    annotations:
      title: Get Certified SEC Valuation Pack
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        company:
          type: string
          description: Company ticker or name, e.g. AAPL, TSLA, MSFT
        pack:
          type: string
          description: Certified SEC valuation pack ID (dcf_valuation_inputs, dupont_5step, altman_z_prime, etc.)
        period:
          type: string
          description: Optional reporting period, e.g. FY2023, Q3 FY2023. Defaults to FY2023 if omitted.
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
      required:
        - company
        - pack
    outputSchema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
      required:
        - content

  - name: query_sec_metric_exact
    version: 1.2.1
    description: >-
      Exact single-cell EDGAR metric recall for company + period + concept.
      Server-side verified fact with filing provenance.
    annotations:
      title: Exact SEC Metric Recall
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        company:
          type: string
          description: Company ticker or name, e.g. AAPL
        metric:
          type: string
          description: EDGAR metric, e.g. net income, free cash flow, total revenue
        period:
          type: string
          description: Fiscal period, e.g. FY2023
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
      required:
        - company
        - metric
        - period
    outputSchema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
      required:
        - content

  - name: compute_sec_cagr
    version: 1.2.1
    description: >-
      Exact compound annual growth rate (CAGR) calculation over verified SEC filing facts.
      Deterministic mathematical execution with zero language model confabulation.
    annotations:
      title: Compute Certified SEC CAGR
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        company:
          type: string
          description: Company ticker or name, e.g. AAPL
        metric:
          type: string
          description: EDGAR metric to compound, e.g. revenue, free cash flow
        start_period:
          type: string
          description: Start fiscal period, e.g. FY2020
        end_period:
          type: string
          description: End fiscal period, e.g. FY2023
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
      required:
        - company
        - metric
        - start_period
        - end_period
    outputSchema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
      required:
        - content

  - name: lattice_arith_evaluate
    version: 1.2.1
    description: >-
      Deterministic zero-error algebraic solver (cagr, ratio, multiply, divide, yoy_series, product_chain)
      over verified SEC EDGAR financial metrics.
    annotations:
      title: Certified Financial Arithmetic
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        op:
          type: string
          description: Operation (cagr | ratio | multiply | divide | yoy_series | product_chain)
        company:
          type: string
          description: Ticker or name when fetching EDGAR cells
        metric:
          type: string
          description: EDGAR metric, e.g. free cash flow, revenue
        start_period:
          type: string
          description: Start period, e.g. FY2020
        end_period:
          type: string
          description: End period, e.g. FY2023
        periods:
          type: string
          description: Optional comma-separated fiscal periods for series
        factors:
          type: string
          description: Optional comma-separated positive factors for product_chain
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
      required:
        - op
    outputSchema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
      required:
        - content

  - name: vln_capabilities_overview
    version: 1.2.1
    description: Dynamic scope overview and capability boundaries for the Volumetric Lattice Network.
    annotations:
      title: VLN Capabilities Overview
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
    outputSchema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
      required:
        - content

  - name: query_sec_sector_peers
    version: 1.2.1
    description: Multi-company sector and industry financial comparisons declared in SEC filings.
    annotations:
      title: Query SEC Sector Peers
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        sector_or_industry:
          type: string
          description: Industry or sector description as declared in SEC filings (e.g. semiconductors, optics)
        metrics:
          type: string
          description: Optional comma-separated SEC XBRL metrics
        period:
          type: string
          description: Optional filing period, e.g. FY2025
        limit:
          type: number
          description: Optional peer limit, default 5
        low_tokens:
          type: boolean
          description: Optional. When true, returns compact JSON schema.
      required:
        - sector_or_industry
    outputSchema:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              text:
                type: string
      required:
        - content
