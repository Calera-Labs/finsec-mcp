# Smithery MCP Server Manifest
# https://smithery.ai/docs/config

name: financesec-mcp
description: Certified SEC fact query for AI agents. Returns verified values with filing provenance or SAFE_REFUSAL. No language model in the fact path.
homepage: https://finsec.caleralabs.com/mcp
license: Apache-2.0
publisher: Calera Labs
tags:
  - sec
  - edgar
  - finance
  - certified-facts
  - provenance
  - financial-facts

# Transport configuration (Streamable Remote HTTP)
transport:
  type: http
  url: https://finsec.caleralabs.com/mcp

# Authentication requirements
auth:
  type: header
  headerName: X-License-Key
  description: Calera Labs FinanceSec API License Key (manage at https://dashboard.caleralabs.com)

# Certified Tool Definitions
tools:
  - name: query_financial_sec
    version: 1.2.0
    description: >-
      Certified SEC fact query. Returns verified values with provenance or SAFE_REFUSAL.
      Does not invent numbers. Treat SAFE_REFUSAL as success-of-honesty, not a tool failure.
      Monetary answers default to the filer's reporting currency; request FX conversion via
      target_currency / usd_only or natural-language 'in USD'.
    annotations:
      title: Query Certified SEC Facts
      readOnlyHint: true
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: >-
            Natural language financial question. Append 'in USD' (or another supported ISO code)
            to convert foreign reporting currencies after verified recall.
        target_currency:
          type: string
          description: >-
            Optional ISO 4217 code (e.g. USD, EUR) for post-recall FX conversion using audited
            annual-average rates. Provenance records original_unit, fx_rate, and fx_converted.
        usd_only:
          type: boolean
          description: When true, forces monetary answers into USD.
      required:
        - query
